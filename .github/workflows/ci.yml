name: NodeDrops Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Test, Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Strict Type Check
        run: npx tsc --noEmit

      - name: Run Vitest Automated Test Suite
        run: npm run test

      - name: Verify Production Build
        run: npm run build
        env:
          NODE_ENV: production
